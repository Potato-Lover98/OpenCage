[package]
name = "opencage"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6"
heed = "0.21"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
